import groovy.lang.GroovyClassLoader

import java.nio.file.Files
import java.nio.file.LinkOption
import java.nio.file.attribute.BasicFileAttributes
import java.nio.charset.StandardCharsets

def downloaderSource = file(
    'buildSrc/src/main/groovy/com/alexmercerind/mediakit/' +
        'VerifiedAssetDownloader.groovy'
).toPath()
if (Files.isSymbolicLink(downloaderSource) ||
    !Files.isRegularFile(downloaderSource, LinkOption.NOFOLLOW_LINKS)) {
    throw new GradleException(
        "Verified asset downloader source is missing or unsafe: " +
            "${downloaderSource}"
    )
}
def sourceBefore = Files.readAttributes(
    downloaderSource,
    BasicFileAttributes,
    LinkOption.NOFOLLOW_LINKS
)
byte[] downloaderBytes = Files.readAllBytes(downloaderSource)
def sourceAfter = Files.readAttributes(
    downloaderSource,
    BasicFileAttributes,
    LinkOption.NOFOLLOW_LINKS
)
if (sourceBefore.size() != sourceAfter.size() ||
    sourceBefore.lastModifiedTime() != sourceAfter.lastModifiedTime() ||
    sourceBefore.fileKey() != sourceAfter.fileKey()) {
    throw new GradleException(
        'Verified asset downloader source changed while it was read.'
    )
}
def downloaderLoader = new GroovyClassLoader(this.class.classLoader)
Class<?> downloaderClass = downloaderLoader.parseClass(
    new String(downloaderBytes, StandardCharsets.UTF_8),
    'VerifiedAssetDownloader.groovy'
)
Class<?> assetClass = downloaderClass.declaredClasses.find {
    it.simpleName == 'Asset'
}
if (assetClass == null) {
    throw new GradleException('Verified asset contract class is missing.')
}

def reviewedAssetData = [
    [
        fileName: 'default-arm64-v8a.jar',
        size: 5729978L,
        sha256:
            '4363dfa5d3d415b91c1f16f6fb90c3fe59a77dfd3f9b824d2b24b492d6b09df9',
    ],
    [
        fileName: 'default-armeabi-v7a.jar',
        size: 5499353L,
        sha256:
            '8ead114fc5a43348d89dc0eb8f41823e549b15115c29f73ee26973f973620995',
    ],
    [
        fileName: 'default-x86.jar',
        size: 5839220L,
        sha256:
            '94c13cb6188b774710e5e487afff6e500c4af504df74b2494d7b12cf9be8a66a',
    ],
    [
        fileName: 'default-x86_64.jar',
        size: 6516632L,
        sha256:
            '90268cd15f0766e07fb8e427388c621161177c9eb343c544f327bd63232bb236',
    ],
].asImmutable()
def reviewedAssets = reviewedAssetData.collect { data ->
    assetClass.getConstructor(
        URI,
        String,
        Long.TYPE,
        String,
    ).newInstance(
        new URI(
            'https://github.com/media-kit/libmpv-android-video-build/' +
                "releases/download/v1.1.7/${data.fileName}"
        ),
        data.fileName,
        data.size,
        data.sha256,
    )
}.asImmutable()
def verifiedOutputDirectory = file("$buildDir/output")
def verifiedJarFiles = reviewedAssetData.collect { data ->
    file("$verifiedOutputDirectory/${data.fileName}")
}.asImmutable()
def verifiedJarCollection = files(verifiedJarFiles)

group 'com.alexmercerind.media_kit_libs_android_video'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'com.alexmercerind.media_kit_libs_android_video'
    }

    compileSdkVersion 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 16
    }

    dependencies {
        implementation verifiedJarCollection
    }
}

def downloadVerifiedDependencies = tasks.register(
    'downloadVerifiedDependencies'
) { task ->
    task.group = 'build setup'
    task.description =
        'Downloads the reviewed Android native JARs with SHA-256 verification.'
    task.outputs.files(verifiedJarFiles)
    downloaderClass.getMethod(
        'requireExecution',
        org.gradle.api.Task,
    ).invoke(null, task)
    task.doLast {
        def downloader = downloaderClass
            .getMethod('production')
            .invoke(null)
        downloaderClass
            .getMethod('ensureAssets', java.nio.file.Path, List)
            .invoke(
                downloader,
                verifiedOutputDirectory.toPath(),
                reviewedAssets,
            )
    }
}
verifiedJarCollection.builtBy(downloadVerifiedDependencies)

tasks.named('preBuild').configure {
    dependsOn(downloadVerifiedDependencies)
}
